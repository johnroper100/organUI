<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>OrganUI</title>
    <link rel="stylesheet" href="/static/css/console.css">
    <script type="importmap">{"imports":{"vue":"/static/js/vue.esm-browser.js"}}</script>
</head>
<body>
    <div id="app" v-cloak>
        <div class="console-shell landing-shell">
            <header class="landing-header">
                <div class="landing-brand">ORGAN<span>UI</span></div>
                <p class="muted">{{ siteName || 'Pipe organ interface' }}</p>
            </header>
            <main class="landing-main">
                <h1>I am the:</h1>
                <nav class="landing-choices" aria-label="Choose your role">
                    <a class="tile landing-choice" href="/console">Organist</a>
                    <a class="tile landing-choice" href="/tuner">Organ Technician</a>
                </nav>
                <p class="landing-pairing muted" v-if="fugaraPairingCode">Fugara pairing code <strong>{{fugaraPairingCode}}</strong></p>
            </main>
            <footer><span class="connection" :class="{online: connected}">{{ connected ? 'Server connected' : 'Disconnected' }}</span></footer>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
        import { createApp } from 'vue'
        const socket = io();
        const app = createApp({
            data() { return {siteName: '', fugaraPairingCode: '', connected: false}; }
        }).mount('#app');
        socket.on('siteName', name => { app.siteName = name; });
        socket.on('fugaraPairingCode', code => { app.fugaraPairingCode = code || ''; });
        socket.on('connect', () => { app.connected = true; });
        socket.on('disconnect', () => { app.connected = false; });
        socket.on('connect_error', () => { app.connected = false; });
    </script>
</body>
</html>
